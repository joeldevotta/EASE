server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  application:
    name: ease-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ease?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
ease:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    username: ${EASE_ADMIN_USERNAME}
    password: ${EASE_ADMIN_PASSWORD}
  student:
    token-secret: ${EASE_STUDENT_TOKEN_SECRET}
